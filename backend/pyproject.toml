[project]
name = "vaultline-banking-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-JWT-Extended==4.6.0",
    "Flask-Cors==4.0.1",
    "Flask-Limiter==3.8.0",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "Werkzeug==3.0.6",
]

[project.scripts]
app = "run:app"

[tool.vercel]
entrypoint = "run:app"
